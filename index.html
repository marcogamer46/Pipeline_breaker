<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIPELINE//BREAKER — welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body id="landingBody">

<main id="authview" class="landing">
  <div class="ascii" id="asciiTitle"></div>

  <div class="hero-pipe" id="heroPipe" aria-hidden="true">
    <span class="hp-stage hp-stage1">F</span>
    <span class="hp-stage hp-stage2">D</span>
    <span class="hp-stage hp-stage3">O</span>
    <span class="hp-stage hp-stage4">E</span>
    <span class="hp-stage hp-stage5">S</span>
  </div>

  <h1 class="hero-title">PIPELINE<span class="c">//</span>BREAKER</h1>
  <p class="hero-sub">Learn the CPU by breaking its pipeline — 30 hands-on challenges, flags, ranks.</p>

  <div class="hero-chips" id="heroChips">
    <span class="chip static">FDOES</span>
    <span class="chip static">hazards</span>
    <span class="chip static">forwarding</span>
    <span class="chip static">bubbles</span>
    <span class="chip static">branch penalty</span>
  </div>

  <div class="auth-box" id="authBox">
    <div class="auth-tabs" id="authTabs">
      <button class="auth-tab active" data-mode="login">Log in</button>
      <button class="auth-tab" data-mode="signup">Sign up</button>
    </div>

    <form id="authForm" novalidate>
      <label for="authUsername">Username</label>
      <input id="authUsername" type="text" autocomplete="username" placeholder="player" required>

      <label for="authEmail">Email</label>
      <input id="authEmail" type="email" autocomplete="email" placeholder="you@example.com" required>

      <label for="authPassword">Password</label>
      <input id="authPassword" type="password" autocomplete="current-password" placeholder="••••••••" minlength="6" required>

      <div class="feedback" id="authFeed"></div>
      <button type="submit" class="btn primary block" id="authSubmit">Log in</button>
      <button type="button" class="btn block" id="guestBtn" style="margin-top:8px">Continue as guest — no account</button>
    </form>
  </div>

  <div class="land-stats" id="landStats"></div>
</main>

<div id="landingFooter">
  <a class="btn" href="learn.html" id="enterDirect">Enter the game →</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/flags.js"></script>
<script src="js/challenges.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/welcome.js"></script>
</body>
</html>
