<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin · PIPELINE//BREAKER</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-page">
  <header class="admin-top">
    <div class="admin-brand">🛠️ <b>PIPELINE//BREAKER</b> <span class="adm-dim">admin console</span></div>
    <div class="admin-right">
      <span id="admUser" class="adm-chip"></span>
      <button type="button" class="btn" id="admBack">← Back to game</button>
      <button type="button" class="btn danger" id="admLogout">Log out</button>
    </div>
  </header>

  <main class="admin-layout">
    <nav class="admin-nav" aria-label="Admin sections">
      <button type="button" class="admin-nav-btn active" data-vt="overview" aria-pressed="true">📊 Overview</button>
      <button type="button" class="admin-nav-btn" data-vt="players" aria-pressed="false">👥 Players</button>
    </nav>
    <section class="admin-pane">
      <div id="admBody" class="admin-body"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin-ui.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
